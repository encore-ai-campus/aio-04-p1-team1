<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>적합도 분석 시작 · 취준나침반</title>
    <style>__CC_CSS__</style>
  </head>
  <body class="cc-member-page" data-page="jd_match">
    __CC_HEADER__
    __CC_MENU__
    <main class="cc-page" data-member-content>
      <nav class="breadcrumb" aria-label="현재 위치"><a href="/main">홈</a><span aria-hidden="true">/</span><span>적합도 분석</span></nav>
      <section class="match-start panel" aria-labelledby="match-start-title">
        <p class="eyebrow">YOUR NEXT DIRECTION</p>
        <h1 id="match-start-title">내 이력서, 이 공고와 잘 맞을까요?</h1>
        <p class="match-start-copy">저장해 둔 채용공고를 선택하면 내 프로필과 공고의 적합도를 분석해 드려요.</p>
        <label class="job-select-label" for="saved-job-select">분석할 공고를 선택해 주세요</label>
        <div class="job-select-wrap"><select id="saved-job-select" disabled><option value="">저장한 공고를 불러오는 중입니다</option></select></div>
        <p class="match-start-status" id="match-start-status" role="status" aria-live="polite"></p>
        <button class="match-start-button" id="match-start-button" type="button" disabled>🚀 분석 시작!</button>
      </section>
    </main>
    <footer><span>취준나침반 · 한 번에 찾고, 한 걸음씩 준비해요.</span><span>YOUR NEXT DIRECTION ↗</span></footer>
    <style>
      .match-start{max-width:760px;margin:70px auto 90px;padding:62px 78px 68px;text-align:center;background:#fff;border-radius:24px;border:1px solid var(--cc-border,#e4e6dd)}
      .match-start h1{font-size:34px;line-height:1.35;letter-spacing:-1.8px;margin:8px 0 18px}.match-start-copy{color:var(--cc-muted,#7b8075);font-size:17px;line-height:1.8;margin:0 auto 54px}.job-select-label{display:block;font-size:17px;font-weight:700;margin-bottom:13px;text-align:left}.job-select-wrap{position:relative}.job-select-wrap:after{content:"⌄";position:absolute;right:21px;top:12px;color:#4c6949;font-size:22px;pointer-events:none}#saved-job-select{appearance:none;width:100%;height:62px;padding:0 52px 0 20px;border:1px solid #dfe3d5;border-radius:13px;background:#fff;font-size:16px;text-align:left;color:#263127}#saved-job-select:disabled{color:#9aa198;background:#f8f9f6}.match-start-status{min-height:24px;color:#b15c4d;font-size:13px;margin:11px 0 16px;text-align:left}.match-start-button{width:100%;height:62px;border:0;border-radius:14px;background:#f7ca43;color:#263127;font-size:19px;font-weight:700}.match-start-button:disabled{cursor:default;opacity:.45}
      @media(max-width:700px){.match-start{margin:35px auto 60px;padding:42px 22px}.match-start h1{font-size:27px}.match-start-copy{font-size:15px;margin-bottom:38px}}
    </style>
    <script>
      (() => {
        const select = document.querySelector('#saved-job-select');
        const button = document.querySelector('#match-start-button');
        const status = document.querySelector('#match-start-status');

        fetch('/jd_match/saved-job-postings')
          .then(response => {
            if (!response.ok) throw new Error();
            return response.json();
          })
          .then(items => {
            select.innerHTML = '<option value="">공고를 선택해 주세요</option>';
            items.forEach(item => {
              const option = document.createElement('option');
              option.value = item.id;
              option.textContent = `${item.company_name} · ${item.title}`;
              select.appendChild(option);
            });
            select.disabled = items.length === 0;
            if (!items.length) status.textContent = '저장한 채용공고가 없습니다. 먼저 채용공고를 저장해 주세요.';
          })
          .catch(() => {
            select.innerHTML = '<option value="">공고를 불러오지 못했습니다</option>';
            select.disabled = true;
            button.disabled = true;
            status.textContent = '저장한 공고를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';
          });

        select.addEventListener('change', () => {
          button.disabled = !select.value;
        });
        button.addEventListener('click', () => {
          if (!button.disabled && select.value) {
            location.href = `/jd_match/${encodeURIComponent(select.value)}`;
          }
        });
      })();
    </script>
    __CC_SCRIPT__
  </body>
</html>
